{% extends "base.html" %}

{% block title %}Удаление товара{% endblock title %}
{% block content %}
<h4>Удаление товара</h4>

<p>Вы уверены, что хотите удалить товар: {{product.name}}?</p>
<form method="post">
  {% csrf_token %}
  <a href="{%url 'product_list'%}" class="btn btn-secondary">Назад</a>
  <button type="submit" class="btn accent">Удалить</button>
</form>
{% endblock content %}
